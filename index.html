<head>

    <style>
        :root {
            --bg-base: #09090b;
            --bg-panel: rgba(24, 24, 27, 0.75);
            --bg-card: rgba(39, 39, 42, 0.6);
            --bg-card-hover: rgba(63, 63, 70, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --success: #10b981;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .light-mode {
            --bg-base: #f1f5f9;
            --bg-panel: rgba(255, 255, 255, 0.85);
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-hover: rgba(241, 245, 249, 1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --border: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .emoji-icon { width: 1.2em; height: 1.2em; vertical-align: -0.2em; display: inline-block; margin-right: 4px; }

        .glass {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        #sidebar {
            width: 280px;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .brand {
            padding: 24px; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border);
        }

        .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .nav-items { flex: 1; overflow-y: auto; padding: 16px 12px; }
        .nav-items::-webkit-scrollbar { width: 4px; }
        .nav-items::-webkit-scrollbar-thumb { background: var(--bg-card-hover); border-radius: 4px; }

        .category-btn {
            width: 100%; text-align: left; padding: 12px 14px; background: transparent; border: none; color: var(--text-muted);
            font-size: 14px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
        }
        .category-btn:hover, .category-btn.active { background: var(--bg-card); color: var(--text-main); }
        .category-count { background: var(--bg-base); padding: 2px 8px; border-radius: 12px; font-size: 11px; border: 1px solid var(--border); }

        #main { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

        #header { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); z-index: 5; gap: 15px; }

        .search-container { position: relative; flex: 1; max-width: 480px; }
        .search-container input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 12px 16px 12px 40px; border-radius: 12px; font-size: 14px; outline: none; transition: all 0.3s ease; }
        .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); fill: var(--text-muted); width: 16px; height: 16px; }

        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

        .icon-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .icon-btn:hover { background: var(--bg-card-hover); }
        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .btn-primary:hover { background: #2563eb; }

        .stats-bar { padding: 12px 32px; font-size: 12px; color: var(--text-muted); display: flex; gap: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; }

        #content-area { flex: 1; padding: 32px; overflow-y: auto; }
        .section-title { font-size: 24px; font-weight: 600; margin-bottom: 24px; display: flex; align-items: center; }

        .bookmark-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .bookmark-container.list-view { display: flex; flex-direction: column; gap: 12px; }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 12px; transition: all 0.2s ease; position: relative; }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3); }
        .list-view .card { flex-direction: row; align-items: center; padding: 12px 20px; transform: none !important; }

        .card-header { display: flex; align-items: center; gap: 16px; flex: 1; overflow: hidden; }
        .favicon { min-width: 32px; height: 32px; border-radius: 8px; background: var(--bg-base); object-fit: cover; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: var(--text-muted); border: 1px solid var(--border); }
        .list-view .favicon { min-width: 24px; height: 24px; font-size: 12px; }

        .card-title { font-size: 15px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .list-view .card-title { -webkit-line-clamp: 1; }

        .card-url { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 40px; }
        .list-view .card-url { text-align: right; margin-right: 70px; }

        .card-actions { position: absolute; top: 20px; right: 15px; display: flex; gap: 8px; opacity: 0; transition: opacity 0.2s; }
        .card:hover .card-actions { opacity: 1; }
        .list-view .card-actions { top: 50%; transform: translateY(-50%); opacity: 1; right: 20px;}

        .action-btn { background: var(--bg-base); border: 1px solid var(--border); border-radius: 6px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
        .action-btn:hover { color: var(--text-main); border-color: var(--text-muted); }
        .action-btn.delete:hover { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
        .action-btn.fav.active { color: #f59e0b; border-color: #f59e0b; }
        .action-btn svg { width: 14px; height: 14px; fill: currentColor; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; transform: translateY(20px); transition: transform 0.3s ease; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); margin: 20px; }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input { width: 100%; background: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 14px; outline: none; transition: border 0.2s; }
        .form-group input:focus { border-color: var(--accent); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
        .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border); padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: background 0.2s; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #sidebar { position: absolute; left: -100%; transition: left 0.3s ease; }
            #sidebar.open { left: 0; width: 80%; background: var(--bg-panel); z-index: 50; }
            #header { padding: 15px; flex-direction: column; align-items: stretch; gap: 10px; }
            .controls { justify-content: space-between; }
            .card-actions { opacity: 1; }
            .list-view .card-url { display: none; }
            .stats-bar { padding: 10px 15px; }
            #content-area { padding: 15px; }
        }
        .mobile-menu-btn { display: none; }
        @media (max-width: 768px) { .mobile-menu-btn { display: flex; } }
    </style>
</head>

    </div>
</main>

<!-- Modal for Adding Bookmark -->
<div id="add-modal" class="modal-overlay">

            <div class="form-group"><label>URL</label><input type="url" id="bm-url" required></div>
            <div class="form-group"><label>Category</label><input type="text" id="bm-cat" list="cat-datalist" required><datalist id="cat-datalist"></datalist></div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="close-modal-btn">Cancel</button>
                <button type="submit" class="btn-primary">Save Bookmark</button>
            </div>
        </form>
    </div>
</div>

    let bookmarks = JSON.parse(localStorage.getItem('fuad_db_final'));
    if (!bookmarks || bookmarks.length === 0) {
        bookmarks = fullBookmarks;
        localStorage.setItem('fuad_db_final', JSON.stringify(bookmarks));
    }

    let favorites = JSON.parse(localStorage.getItem('fuad_favs_final')) || [];
    let currentCategory = 'All';
    let searchQuery = '';
    let isGridView = true;

    function renderEmoji(text) {
        return text.replace(/🇮🇷/g, '<img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f1ee-1f1f7.png" class="emoji-icon" alt="IR">');
    }

    function getDynamicCategories() {
        const cats = new Set(bookmarks.map(b => b.cat));
        return ['All', '📌 Favorites', ...Array.from(cats)].sort();
    }

    const catListEl = document.getElementById('category-list');
    const bookmarksGridEl = document.getElementById('bookmarks-grid');
    const searchEl = document.getElementById('search');
    const catTitleEl = document.getElementById('current-category-title');
    const catDatalistEl = document.getElementById('cat-datalist');

    function saveToStorage() {
        localStorage.setItem('fuad_db_final', JSON.stringify(bookmarks));
        localStorage.setItem('fuad_favs_final', JSON.stringify(favorites));
        updateUI();
    }

    window.deleteBookmark = function(e, url) {
        e.preventDefault(); e.stopPropagation();
        if (confirm("Are you sure you want to delete this bookmark?")) {
            bookmarks = bookmarks.filter(b => b.url !== url);
            favorites = favorites.filter(f => f !== url);
            saveToStorage();
        }
    }

    window.toggleFav = function(e, url) {
        e.preventDefault(); e.stopPropagation();
        if (favorites.includes(url)) { favorites = favorites.filter(f => f !== url); }
        else { favorites.push(url); }
        saveToStorage();
    }

    document.getElementById('add-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('bm-title').value.trim();
        const url = document.getElementById('bm-url').value.trim();
        const cat = document.getElementById('bm-cat').value.trim();

        if (bookmarks.some(b => b.url === url)) { alert("This URL already exists in your bookmarks!"); return; }
        bookmarks.push({ title, url, cat });
        saveToStorage();
        document.getElementById('add-modal').classList.remove('active');
        document.getElementById('add-form').reset();
    });

    // ----- IMPORT / EXPORT LOGIC -----
    document.getElementById('export-db-btn').addEventListener('click', () => {
        const data = { bookmarks, favorites };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'fuad_db.json';
        a.click();
        URL.revokeObjectURL(url);
    });

    document.getElementById('import-db-btn').addEventListener('click', () => {
        document.getElementById('import-file').click();
    });

    document.getElementById('import-file').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (importedData.bookmarks) bookmarks = importedData.bookmarks;
                if (importedData.favorites) favorites = importedData.favorites;
                saveToStorage();
                alert("Database loaded successfully!");
            } catch (err) {
                alert("Error: Invalid JSON file.");
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // Reset input
    });
    // ---------------------------------

    function updateUI() { renderSidebar(); renderBookmarks(); updateStats(); updateDatalist(); }

    function renderSidebar() {
        const categories = getDynamicCategories();
        catListEl.innerHTML = '';
        if (!categories.includes(currentCategory) && currentCategory !== 'All' && currentCategory !== '📌 Favorites') currentCategory = 'All';

        categories.forEach(cat => {
            const count = cat === 'All' ? bookmarks.length : cat === '📌 Favorites' ? favorites.length : bookmarks.filter(b => b.cat === cat).length;
            const btn = document.createElement('button');
            btn.className = `category-btn ${cat === currentCategory ? 'active' : ''}`;
            btn.innerHTML = `<span>${renderEmoji(cat)}</span> <span class="category-count">${count}</span>`;
            btn.onclick = () => { currentCategory = cat; searchQuery = ''; searchEl.value = ''; closeSidebarOnMobile(); updateUI(); };
            catListEl.appendChild(btn);
        });
    }

    function renderBookmarks() {
        bookmarksGridEl.innerHTML = '';
        catTitleEl.innerHTML = renderEmoji(currentCategory);

        let filtered = bookmarks;
        if (currentCategory === '📌 Favorites') filtered = bookmarks.filter(b => favorites.includes(b.url));
        else if (currentCategory !== 'All') filtered = bookmarks.filter(b => b.cat === currentCategory);

        if (searchQuery) {
            const lowerQ = searchQuery.toLowerCase();
            filtered = filtered.filter(b => b.title.toLowerCase().includes(lowerQ) || b.url.toLowerCase().includes(lowerQ));
        }

        if (filtered.length === 0) { bookmarksGridEl.innerHTML = `<p style="color: var(--text-muted);">No bookmarks found.</p>`; return; }
        filtered.sort((a, b) => a.title.localeCompare(b.title));

        filtered.forEach(b => {
            const isFav = favorites.includes(b.url);
            let domain = b.url; try { domain = new URL(b.url).hostname; } catch(e){}
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

            const card = document.createElement('a'); card.href = b.url; card.target = "_blank"; card.className = 'card glass';
            card.innerHTML = `
                    <div class="card-actions" onclick="event.preventDefault();">
                        <button class="action-btn fav ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${b.url}')"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
                        <button class="action-btn delete" onclick="deleteBookmark(event, '${b.url}')"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
                    </div>
                    <div class="card-header">
                        <img src="${faviconUrl}" alt="" class="favicon" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="favicon" style="display:none; background: var(--accent-glow); color: var(--text-main);">${domain.charAt(0).toUpperCase()}</div>
                        <div class="card-title">${b.title}</div>
                    </div>
                    <div class="card-url">${domain}</div>
                `;
            bookmarksGridEl.appendChild(card);
        });
    }

    function updateStats() {
        document.getElementById('stat-total').textContent = bookmarks.length;
        document.getElementById('stat-favs').textContent = favorites.length;
        document.getElementById('stat-cats').textContent = getDynamicCategories().length - 2;
    }

    function updateDatalist() {
        catDatalistEl.innerHTML = '';
        getDynamicCategories().filter(c => c !== 'All' && c !== '📌 Favorites').forEach(c => {
            const option = document.createElement('option'); option.value = c; catDatalistEl.appendChild(option);
        });
    }

    searchEl.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        if (currentCategory !== 'All' && currentCategory !== '📌 Favorites' && searchQuery !== '') currentCategory = 'All';
        updateUI();
    });

    document.getElementById('open-modal-btn').addEventListener('click', () => { document.getElementById('add-modal').classList.add('active'); });
    document.getElementById('close-modal-btn').addEventListener('click', () => { document.getElementById('add-modal').classList.remove('active'); document.getElementById('add-form').reset(); });
    document.getElementById('add-modal').addEventListener('click', (e) => { if (e.target === document.getElementById('add-modal')) document.getElementById('close-modal-btn').click(); });

    document.getElementById('toggle-view').addEventListener('click', () => {
        isGridView = !isGridView; bookmarksGridEl.className = isGridView ? 'bookmark-container' : 'bookmark-container list-view';
    });

    document.getElementById('toggle-theme').addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('fuad_theme_final', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    });

    if(localStorage.getItem('fuad_theme_final') === 'light') document.body.classList.add('light-mode');

    // Mobile Sidebar Logic
    const sidebar = document.getElementById('sidebar');
    document.getElementById('toggle-sidebar').addEventListener('click', () => { sidebar.classList.toggle('open'); });
    window.closeSidebarOnMobile = function() { if(window.innerWidth <= 768) sidebar.classList.remove('open'); };

    updateUI();
</script>
