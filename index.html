<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuad Bookmark Manager</title>
    <meta name="description" content="A modern, glassmorphism bookmark manager and PWA.">
    <link rel="icon" type="image/png" href="Fuad.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="Fuad.png">
</head>
<body class="glass dark-mode">

<!-- Sidebar Navigation -->
<aside id="sidebar" class="glass">
    <div class="brand">
        <img src="Fuad.png" alt="Profile" class="avatar" id="profile-avatar">
        <span class="brand-name">Fuad Bookmark Manager</span>
    </div>

    <div class="sidebar-header">
        <span>Folders</span>
        <button id="open-add-cat-btn" class="icon-btn-small" title="Create New Folder">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
    </div>

    <div class="nav-items" id="category-list">
        <!-- Categories will be injected here via JavaScript -->
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
        Designed with 🫀 by <a href="https://github.com/fuadfadam" target="_blank" rel="noopener noreferrer">Fuad</a>
    </div>
</aside>

<!-- Main Content Area -->
<main id="main">
    <header id="header" class="glass">
        <div class="header-left">
            <button class="icon-btn mobile-menu-btn" id="toggle-sidebar" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="search" placeholder="Search title, URL, or description..." autocomplete="off">
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="open-add-modal-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span>New</span>
            </button>
            <button class="icon-btn" id="export-html-btn" title="Export as Netscape HTML File">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
            <button class="icon-btn" id="import-html-btn" title="Import Netscape HTML File">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            </button>
            <input type="file" id="import-file" accept=".html" style="display: none;">
            <button class="icon-btn" id="toggle-view" title="Toggle Grid/List View">
                <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
            </button>
            <button class="icon-btn" id="toggle-theme" title="Toggle Light/Dark Theme">
                <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>
            </button>
        </div>
    </header>

    <div class="stats-bar glass">
        <span>📚 <span id="stat-total">0</span> Total Links</span>
        <span>⭐ <span id="stat-favs">0</span> Favorites</span>
        <span>📂 <span id="stat-cats">0</span> Folders</span>
    </div>

    <div id="content-area">
        <div class="section-header">
            <h2 class="section-title" id="current-category-title">All Bookmarks</h2>
            <button class="icon-btn" id="edit-cat-btn" style="display: none;" title="Rename Category">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <button class="icon-btn danger-btn" id="delete-cat-btn" style="display: none;" title="Delete Category">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
        </div>
        <div id="bookmarks-grid" class="bookmark-container">
            <!-- Bookmark Cards Injection -->
        </div>
    </div>
</main>

<!-- Modal: Add Bookmark -->
<div id="add-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-header">Add New Bookmark</h3>
        <form id="add-form">
            <div class="form-group">
                <label for="bm-title">Title</label>
                <input type="text" id="bm-title" placeholder="Website Name" required>
            </div>
            <div class="form-group">
                <label for="bm-url">URL</label>
                <input type="text" id="bm-url" placeholder="example.com" required>
            </div>
            <div class="form-group">
                <label for="bm-cat">Category / Folder</label>
                <input type="text" id="bm-cat" placeholder="Leave empty for 'All'" list="cat-datalist">
                <datalist id="cat-datalist"></datalist>
            </div>
            <div class="form-group">
                <label for="bm-desc">Description (Optional)</label>
                <textarea id="bm-desc" rows="2" placeholder="Add a short description..."></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary close-modal-btn">Cancel</button>
                <button type="submit" class="btn-primary">Save Bookmark</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Edit Bookmark -->
<div id="edit-bm-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-header">Edit Bookmark</h3>
        <form id="edit-bm-form">
            <div class="form-group">
                <label for="edit-bm-title">Title</label>
                <input type="text" id="edit-bm-title" required>
            </div>
            <div class="form-group">
                <label for="edit-bm-url">URL</label>
                <input type="text" id="edit-bm-url" required>
            </div>
            <div class="form-group">
                <label for="edit-bm-cat">Category / Folder</label>
                <input type="text" id="edit-bm-cat" list="edit-bm-datalist">
                <datalist id="edit-bm-datalist"></datalist>
            </div>
            <div class="form-group">
                <label for="edit-bm-desc">Description</label>
                <textarea id="edit-bm-desc" rows="2"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary close-modal-btn">Cancel</button>
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Add Category -->
<div id="add-cat-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-header">Create Folder</h3>
        <form id="add-cat-form">
            <div class="form-group">
                <label for="new-folder-name">Folder Name (You can use Emojis)</label>
                <input type="text" id="new-folder-name" placeholder="e.g. 🎵 Music" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary close-modal-btn">Cancel</button>
                <button type="submit" class="btn-primary">Create Folder</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Edit Category -->
<div id="edit-cat-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-header">Rename Category</h3>
        <form id="edit-cat-form">
            <div class="form-group">
                <label for="new-cat-name">New Category Name</label>
                <input type="text" id="new-cat-name" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary close-modal-btn">Cancel</button>
                <button type="submit" class="btn-primary">Update All</button>
            </div>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
